<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frutas do Abismo</title>
<meta name="theme-color" content="#0A121B">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
html,body{height:100%;margin:0;background:#0E1620;color:#9FB3C8;font-family:system-ui,sans-serif}
#map{position:absolute;inset:0;background:#0E1620}
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) saturate(.7) brightness(.78) contrast(1.05)}
#map{background:#0A121B}
#fog{position:fixed;inset:-20%;z-index:450;pointer-events:none;background:radial-gradient(circle at 20% 30%,#9FB3C826 0,transparent 35%),radial-gradient(circle at 75% 65%,#9FB3C820 0,transparent 40%),radial-gradient(circle at 45% 92%,#9FB3C81a 0,transparent 30%);animation:dr 40s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(8%,-6%) scale(1.15)}}
#vg{position:fixed;inset:0;z-index:800;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#05080ccc 100%)}
.fr{position:relative}
.fr.lg::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:rg 2s ease-out infinite}
@keyframes rg{from{transform:scale(.8);opacity:.8}to{transform:scale(2);opacity:0}}
.hud{position:absolute;z-index:1000;left:0;right:0;padding:10px;display:flex;gap:8px;pointer-events:none}
.top{top:env(safe-area-inset-top,0px)}
.bot{bottom:env(safe-area-inset-bottom,0px);justify-content:center}
.pill,button{pointer-events:auto;background:#0E1620ee;border:1px solid #3B556E;color:#9FB3C8;border-radius:20px;padding:8px 14px;font-size:14px}
.top .pill{margin-right:auto}
#toast{position:absolute;z-index:4000;left:50%;top:70px;transform:translateX(-50%);background:#1B2A38;border:1px solid #3B556E;border-radius:8px;padding:8px 14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:80%}
.fr{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid #ffffff55;box-shadow:0 0 14px 4px var(--c);animation:p 1.6s infinite alternate}
@keyframes p{to{transform:scale(1.2);box-shadow:0 0 22px 8px var(--c)}}
#cam{position:fixed;inset:0;z-index:3000;background:#05080c;display:none;overflow:hidden}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
#fx{position:absolute;width:64px;height:64px;transition:left .6s,top .6s;z-index:2}
#hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;text-align:center;font-size:18px;color:#fff;text-shadow:0 0 6px #000;z-index:2}
#cls{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);z-index:2}
#pnl{position:fixed;inset:0;z-index:2500;background:#0E1620;display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 24px)}
#pnl h3{margin:18px 0 4px;font-weight:500}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.card{border:1px solid #3B556E;border-radius:10px;padding:10px 12px;margin:8px 0;background:#1B2A38;color:#C8D6E5}
.card.sel{border-color:#fff;box-shadow:0 0 0 2px #ffffff55}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#fuse{width:100%;margin-top:14px;padding:12px;border-radius:10px;font-size:16px;background:#4A235A;border-color:#A569D6;color:#fff}
.me{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #2E86C1;box-shadow:0 0 0 8px #2E86C144;animation:pm 2.4s ease-in-out infinite}
@keyframes pm{50%{box-shadow:0 0 0 14px #2E86C122}}
</style>
</head>
<body>
<div id="map"></div>
<div id="fog"></div><div id="vg"></div>
<div class="hud top"><div class="pill" id="inv">Frutas: 0</div></div>
<div id="cam"><video id="vid" autoplay playsinline muted></video><div id="fx" class="fr"></div><div id="hint"></div><button id="cls">Fugir</button></div>
<div id="pnl"><div class="hd"><b>Inventário</b><button id="pc">Fechar</button></div><div id="pb"></div></div>
<div id="toast"></div>
<div class="hud bot"><button id="ctr">Centralizar</button><button id="tst">Modo teste: off</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const RAR=[
 {n:"comum",c:"#E74C3C",w:.75,names:["Fruta da Brasa","Fruta do Eco","Fruta da Corda","Fruta da Areia"]},
 {n:"rara",c:"#5DADE2",w:.2,names:["Fruta da Maré","Fruta do Gelo Negro","Fruta do Relâmpago"]},
 {n:"lendária",c:"#A569D6",w:.05,names:["Fruta do Abismo","Fruta da Sombra Antiga"]}
];
const MAXF=15, RADIUS=300, CATCH=50;
let me=null, meMk=null, fruits=[], watchId=null, test=false, inv=[];
try{inv=JSON.parse(localStorage.getItem("inv")||"[]")}catch(e){}
const $=id=>document.getElementById(id);
const showInv=()=>$("inv").textContent="Inventário: "+inv.length;
showInv();

const map=L.map("map",{zoomControl:false}).setView([-14.2,-51.9],4);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:19,
 attribution:"&copy; OpenStreetMap contributors"}).addTo(map);

function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2500)}

function setPos(lat,lng){
 const first=!me;
 me=L.latLng(lat,lng);
 if(!meMk) meMk=L.marker(me,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false}).addTo(map);
 else meMk.setLatLng(me);
 if(first){map.setView(me,17);for(let i=0;i<8;i++)spawn()}
}

function roll(){
 let r=Math.random(),a=0;
 for(let i=0;i<RAR.length;i++){a+=RAR[i].w;if(r<a)return i}
 return 0;
}

function spawn(){
 if(!me||fruits.length>=MAXF)return;
 const d=RADIUS*Math.sqrt(Math.random()), a=Math.random()*Math.PI*2;
 const lat=me.lat+(d*Math.cos(a))/111320;
 const lng=me.lng+(d*Math.sin(a))/(111320*Math.cos(me.lat*Math.PI/180));
 const ri=roll(), R=RAR[ri];
 const name=R.names[Math.floor(Math.random()*R.names.length)];
 const mk=L.marker([lat,lng],{icon:L.divIcon({className:"",html:'<div class="fr'+(ri===2?" lg":"")+'" style="--c:'+R.c+'"></div>',iconSize:[22,22]})}).addTo(map);
 const f={mk,name,rarity:R.n,c:R.c};
 mk.on("click",()=>tap(f));
 fruits.push(f);
}

function tap(f){
 if(!me)return toast("Aguardando o GPS...");
 const d=Math.round(map.distance(me,f.mk.getLatLng()));
 if(d>CATCH)return toast(f.name+" ("+f.rarity+") está a "+d+" m. Chegue a "+CATCH+" m para pegar.");
 openCam(f);
}

let cur=null,hits=0,mv=null,capT=null,stream=null;
async function openCam(f){
 cur=f;hits=0;
 $("cam").style.display="block";
 $("hint").textContent="Toque na fruta 3 vezes!";
 $("fx").style.setProperty("--c",f.c);
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
  $("vid").srcObject=stream;
 }catch(e){toast("Sem acesso à câmera. Usando fundo escuro.")}
 moveFx();
 mv=setInterval(moveFx,900);
 capT=setTimeout(()=>{if(cur){closeCam();toast("A fruta escapou! Ela continua no mapa.")}},20000);
}
function moveFx(){
 const e=$("fx");
 e.style.left=(8+Math.random()*72)+"%";
 e.style.top=(18+Math.random()*58)+"%";
}
function closeCam(){
 clearInterval(mv);clearTimeout(capT);
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 $("vid").srcObject=null;
 $("cam").style.display="none";
 cur=null;
}
$("fx").onclick=()=>{
 if(!cur)return;
 hits++;
 if(hits>=3){const f=cur;closeCam();collect(f)}
 else{$("hint").textContent="Mais "+(3-hits)+"!";moveFx()}
};
$("cls").onclick=()=>{closeCam();toast("Você fugiu. A fruta continua no mapa.")};

function collect(f){
 inv.push({name:f.name,rarity:f.rarity,t:Date.now()});
 try{localStorage.setItem("inv",JSON.stringify(inv))}catch(e){}
 map.removeLayer(f.mk);
 fruits=fruits.filter(x=>x!==f);
 showInv();
 toast("Você pegou: "+f.name+" ("+f.rarity+")");
}

function startGPS(){
 if(!navigator.geolocation)return toast("Este aparelho não tem GPS no navegador.");
 watchId=navigator.geolocation.watchPosition(
  p=>setPos(p.coords.latitude,p.coords.longitude),
  ()=>toast("Sem acesso ao GPS. Permita a localização ou use o modo teste."),
  {enableHighAccuracy:true,maximumAge:2000}
 );
}

$("ctr").onclick=()=>{if(me)map.setView(me,17);else toast("Aguardando o GPS...")};
$("tst").onclick=()=>{
 test=!test;
 $("tst").textContent="Modo teste: "+(test?"on":"off");
 if(test){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  toast("Toque no mapa para mover o jogador.");
 }else startGPS();
};
map.on("click",e=>{if(test)setPos(e.latlng.lat,e.latlng.lng)});

setInterval(()=>{
 if(!me)return;
 fruits=fruits.filter(f=>{
  if(map.distance(me,f.mk.getLatLng())>RADIUS*2){map.removeLayer(f.mk);return false}
  return true;
 });
 spawn();
},10000);

const RC={"comum":"#E74C3C","rara":"#5DADE2","lendária":"#A569D6"};
const BONUS={"comum":10,"rara":25,"lendária":50};
let chars=[],selF=-1,selC=-1;
try{chars=JSON.parse(localStorage.getItem("chars")||"[]")}catch(e){}
if(!chars.length)chars=[{n:"Capitã Maré",p:100,f:null},{n:"Arpoador Sombra",p:90,f:null},{n:"Navegante Bruma",p:80,f:null}];

function save(){
 try{localStorage.setItem("inv",JSON.stringify(inv));localStorage.setItem("chars",JSON.stringify(chars))}catch(e){}
}
function render(){
 let h="<h3>Personagens</h3>";
 chars.forEach((c,i)=>{
  h+='<div class="card'+(i===selC?" sel":"")+'" data-c="'+i+'"><b>'+c.n+'</b> · poder '+c.p+"<br>"+
   (c.f?'<span class="dot" style="background:'+RC[c.f.rarity]+'"></span>'+c.f.name:"sem fruta")+"</div>";
 });
 h+="<h3>Frutas ("+inv.length+")</h3>";
 if(!inv.length)h+="<p>Nenhuma fruta ainda. Capture no mapa.</p>";
 inv.forEach((f,i)=>{
  h+='<div class="card'+(i===selF?" sel":"")+'" data-f="'+i+'"><span class="dot" style="background:'+RC[f.rarity]+'"></span>'+f.name+" · "+f.rarity+" · +"+BONUS[f.rarity]+" poder</div>";
 });
 h+='<button id="fuse">Fundir fruta com personagem</button>';
 $("pb").innerHTML=h;
}
function fuse(){
 if(selF<0)return toast("Escolha uma fruta.");
 if(selC<0)return toast("Escolha um personagem.");
 const c=chars[selC];
 if(c.f)return toast(c.n+" já tem uma fruta. Cada personagem aguenta só uma.");
 const it=inv.splice(selF,1)[0];
 c.f=it;c.p+=BONUS[it.rarity];
 selF=selC=-1;
 save();showInv();render();
 toast("Fusão feita! "+c.n+" agora tem poder "+c.p+".");
}
$("pb").onclick=e=>{
 const c=e.target.closest("[data-c]"),f=e.target.closest("[data-f]");
 if(e.target.id==="fuse")return fuse();
 if(c)selC=+c.dataset.c;
 else if(f)selF=+f.dataset.f;
 render();
};
$("inv").onclick=()=>{selF=selC=-1;render();$("pnl").style.display="block"};
$("pc").onclick=()=>{$("pnl").style.display="none"};

startGPS();
</script>
</body>
</html>
